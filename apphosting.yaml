# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# A unique identifier for your backend. This is used to identify your backend
# in the Firebase console and in Firebase CLI commands.
backendId: touchup-web

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

# Add any environment variables that you need to be available in your
# backend here. You can also grant your backend access to secrets stored in
# Secret Manager.
# https://firebase.google.com/docs/app-hosting/configure#environment-variables
secretEnvironmentVariables:
  - secret: NEXT_PUBLIC_FIREBASE_API_KEY
  - secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  - secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
  - secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
  - secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  - secret: NEXT_PUBLIC_FIREBASE_APP_ID
  - secret: SMTP_HOST
  - secret: SMTP_PORT
  - secret: SMTP_USER
  - secret: SMTP_PASS
  - secret: SMTP_FROM_EMAIL
  - secret: ADMIN_EMAIL_BOOKING
  - secret: ADMIN_EMAIL_CONTACT
  - secret: FIREBASE_PRIVATE_KEY
  - secret: FIREBASE_CLIENT_EMAIL

env:
  - variable: ADMIN_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
