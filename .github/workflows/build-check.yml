# Build check for pull requests (no deploy).
# Runs `npm ci + npm run build` on GitHub's runner when a PR targets main.
# Broken code shows red ❌ on the PR and never reaches main (= never auto-deploys).
# No secrets, no SSH, no cPanel involvement.

name: Build check (no deploy)

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
